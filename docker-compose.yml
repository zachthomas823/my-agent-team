volumes:
  shared-data:
  redis-data:

networks:
  agent-net:
    internal: true
  gateway-net:

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - agent-net
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - shared-data:/data
      - ${HOME}/.aws:/root/.aws:ro
    environment:
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    networks:
      - agent-net
      - gateway-net
    depends_on:
      - redis
    restart: unless-stopped

  agent-analyst:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=analyst
      - AGENT_ID=analyst-01
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      - ${HOME}/.aws:/home/agent/.aws:ro
    networks:
      - agent-net
      - gateway-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped

  agent-pm:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=product-manager
      - AGENT_ID=pm-01
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      - ${HOME}/.aws:/home/agent/.aws:ro
    networks:
      - agent-net
      - gateway-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped

  agent-architect:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=architect
      - AGENT_ID=architect-01
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
