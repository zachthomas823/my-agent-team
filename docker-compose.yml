volumes:
  shared-data:
  redis-data:

networks:
  agent-net:
    internal: true
  gateway-net:

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - agent-net
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - shared-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    networks:
      - agent-net
      - gateway-net
    depends_on:
      - redis
    restart: unless-stopped

  agent-analyst:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=analyst
      - AGENT_ID=analyst-01
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      # settings.json generated by scripts/launch-agents.sh — contains STS
      # credentials and Bedrock model ARNs. Writable so the refresh loop can
      # patch credentials in-place via docker exec.
      - ./docker/settings.json:/home/agent/.claude/settings.json
    networks:
      - agent-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped

  agent-pm:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=product-manager
      - AGENT_ID=pm-01
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      - ./docker/settings.json:/home/agent/.claude/settings.json
    networks:
      - agent-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped

  agent-architect:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=architect
      - AGENT_ID=architect-01
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      - ./docker/settings.json:/home/agent/.claude/settings.json
    networks:
      - agent-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped

  agent-developer:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=developer
      - AGENT_ID=dev-01
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      - ./docker/settings.json:/home/agent/.claude/settings.json
    networks:
      - agent-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped

  agent-qa:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      - AGENT_ROLE=qa
      - AGENT_ID=qa-01
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
    volumes:
      - shared-data:/data
      - ./docker/settings.json:/home/agent/.claude/settings.json
    networks:
      - agent-net
    depends_on:
      - redis
      - orchestrator
    restart: unless-stopped
